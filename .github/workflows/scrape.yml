name: Weekly Vuokraovi Scrape

on:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 3:00 AM UTC (6:00 AM Helsinki summer time, 5:00 AM winter time)
  workflow_dispatch:       # Also allows manual trigger from GitHub UI
    inputs:
      export_only:
        description: "Only refresh data.csv for the dashboard (no new scrape)"
        type: boolean
        default: false
      notify_test:
        description: "Send the update notification now (for testing)"
        type: boolean
        default: false

permissions:
  contents: write          # needed to commit data.csv

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Remember latest date before update
        id: before
        run: echo "latest=$(tail -n +2 data.csv | cut -d, -f1 | sort | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Run scraper
        if: ${{ !inputs.export_only }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scrape_vuokraovi.py

      - name: Export sheet to data.csv
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python export_data.py

      - name: Check for new data
        id: after
        run: |
          latest=$(tail -n +2 data.csv | cut -d, -f1 | sort | tail -1)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" \> "${{ steps.before.outputs.latest }}" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi
          echo "Latest date before: ${{ steps.before.outputs.latest }}, after: $latest"

      - name: Commit data.csv
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add data.csv
          git diff --cached --quiet && { echo "data.csv unchanged"; exit 0; }
          git commit -m "Update dashboard data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

      - name: Wait for the dashboard to redeploy
        if: ${{ steps.after.outputs.new == 'true' }}
        run: sleep 120   # GitHub Pages needs a minute or two before the link shows the new data

      - name: Send update notification
        if: ${{ steps.after.outputs.new == 'true' || inputs.notify_test }}
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python notify.py
