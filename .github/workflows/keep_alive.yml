name: Keep Alive

on:
  schedule:
    - cron: "0 2 * * 1"  # Every Monday at 2:00 AM UTC, one hour before the scraper
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep alive ping
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          echo "Last keep-alive: $(date)" > keep_alive.txt
          git add keep_alive.txt
          git commit -m "Keep alive $(date)"
          git push
